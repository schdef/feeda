[project]
name = "feeda"
version = "0.1.0"
description = "Self-hosted intelligent RSS reader"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "feedparser>=6.0.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dateutil>=2.8.0",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools.packages.find]
include = ["feeda*"]
